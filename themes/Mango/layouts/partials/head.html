<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Title: ONLY homepage shows site title -->
<title>
    {{ if .IsHome }}
        {{ .Site.Title }}
    {{ else }}
        {{ .Title }}
    {{ end }}
</title>
<meta name="google-site-verification" content="ZO1_y3hTYC2w8Arxt8Sj35VyWaU-V6Vz4yoSD5kTyts" />
<!-- Description -->
<meta name="description" content="{{ if .IsHome }}
    {{ .Site.Params.description }}
{{ else if .Description }}
    {{ .Description }}
{{ else }}
    {{ .Title }}
{{ end }}">

<!-- Keywords -->
<meta name="keywords" content="{{ if .IsHome }}
    {{ .Site.Params.keywords }}
{{ else if .Params.keywords }}
    {{ delimit .Params.keywords ", " }}
{{ else }}
    {{ .Title }}
{{ end }}">

<!-- Canonical -->
<link rel="canonical" href="{{ .Permalink }}">
<!-- CSS -->
<style>
/* ===== OPTIMIZED CSS - Light & Fast ===== */
/* Remove all transitions and animations for instant response */

:root {
    --primary-color: #b45f3b;
    --bg-color: #faf8f5;
    --text-color: #1e1e2a;
    --border-color: #eeeae5;
    --card-bg: #ffffff;
    --radius: 20px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Smooth scrolling - native browser optimization */
html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeSpeed;
}

/* Will-change hint for smoother scrolling */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    will-change: transform;
}

/* ===== HEADER - Minimal ===== */
.site-header {
    background: rgba(255, 255, 255, 0.95);
    padding: 12px 0;
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 8px;
}

.logo-icon {
    font-size: 1.6rem;
    line-height: 1;
}

.logo-text {
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--text-color);
}

.logo-text span {
    color: var(--primary-color);
    font-weight: 300;
}

/* Navigation - No transitions */
.main-nav {
    display: flex;
    gap: 24px;
    align-items: center;
}

.main-nav a {
    text-decoration: none;
    font-weight: 500;
    color: #2c2c3a;
    font-size: 0.95rem;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
}

.main-nav a:hover,
.main-nav a.active {
    color: var(--primary-color);
    border-bottom-color: var(--primary-color);
}

.menu-toggle {
    display: none;
    background: none;
    border: 1px solid #ddd8d0;
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 1.4rem;
    cursor: pointer;
    color: #2c2c3a;
}

/* ===== HERO - Clean & Fast ===== */
.hero {
    padding: 32px 0 24px;
    margin: 16px 0 24px;
    text-align: center;
}

.hero-content h1 {
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--text-color);
    margin-bottom: 12px;
}

.hero-content h1 small {
    display: block;
    font-size: 1rem;
    font-weight: 400;
    color: #5f5f72;
    margin-top: 4px;
}

.hero-tagline {
    font-size: 1rem;
    color: #3d3d52;
    max-width: 700px;
    margin: 0 auto;
    line-height: 1.6;
}

/* ===== DRAMA SECTION ===== */
.drama-section {
    margin: 30px 0 50px;
}

.section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
    border-bottom: 2px solid #e7e1d9;
    padding-bottom: 12px;
}

.section-heading h2 {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-color);
}

.section-heading h2 em {
    font-style: normal;
    color: var(--primary-color);
}

.season-badge {
    background: #e7e1d9;
    padding: 4px 14px;
    border-radius: 40px;
    font-size: 0.85rem;
    font-weight: 600;
    color: #3d3d52;
}

/* ===== SEASONS NAV - No hover animations ===== */
.seasons-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
}

.season-btn {
    background: #ffffff;
    border: 1px solid #dbd3ca;
    border-radius: 60px;
    padding: 6px 18px;
    font-weight: 600;
    font-size: 0.95rem;
    color: #1e1e2a;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0,0,0,0.02);
}

.season-btn:hover {
    background: var(--primary-color);
    border-color: var(--primary-color);
    color: white;
}

.season-btn.active-season {
    background: var(--primary-color);
    border-color: var(--primary-color);
    color: white;
}

/* ===== PLAYER & EPISODES ===== */
.player-and-cards {
    display: grid;
    grid-template-columns: 1fr 1.8fr;
    gap: 24px;
    margin-top: 8px;
}

.player-box {
    background: #1a1a26;
    border-radius: 20px;
    padding: 16px 14px 14px;
    align-self: start;
}

.player-box h3 {
    color: #eae3db;
    font-weight: 500;
    font-size: 0.95rem;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.player-box h3 span {
    background: var(--primary-color);
    padding: 2px 10px;
    border-radius: 40px;
    font-size: 0.65rem;
    font-weight: 600;
    color: white;
}

.player-wrapper {
    background: #0f0f18;
    border-radius: 14px;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border: 1px solid #323240;
}

.player-wrapper iframe {
    width: 100%;
    height: 100%;
    border: none;
}

/* ===== EPISODE CARDS - No transitions ===== */
.episodes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 16px;
}

.episode-card-link {
    text-decoration: none;
    color: inherit;
    display: block;
}

.episode-card-link[style*="display: none"] {
    display: none !important;
}

.episode-card {
    background: #ffffff;
    border-radius: 16px;
    padding: 10px 10px 12px;
    border: 1px solid #eee8e0;
    display: flex;
    flex-direction: column;
    cursor: pointer;
}

.episode-card:hover {
    border-color: #b45f3b;
}

.episode-feature {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #eae3db;
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

.episode-feature img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.episode-feature .fallback-emoji {
    font-size: 2rem;
    opacity: 0.4;
}

.episode-title {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text-color);
    line-height: 1.3;
}

.episode-meta {
    font-size: 0.7rem;
    color: #6f6254;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    margin-top: 4px;
    border-top: 1px solid #f0ebe4;
    padding-top: 6px;
    align-items: center;
}

.episode-meta .season-label {
    background: #efe9e1;
    padding: 0 8px;
    border-radius: 40px;
    font-weight: 500;
    font-size: 0.65rem;
    color: #3d3d52;
}

.episode-author {
    font-weight: 500;
    color: var(--primary-color);
    font-size: 0.65rem;
    display: flex;
    align-items: center;
    gap: 3px;
}

.episode-author::before {
    content: "✍️";
    font-size: 0.6rem;
    opacity: 0.6;
}

.episode-count {
    font-size: 0.65rem;
    font-weight: 400;
    color: #8a7a6a;
    margin-left: 3px;
}

.season-btn.active-season .episode-count {
    color: #e0d5ca;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .player-and-cards {
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .menu-toggle {
        display: block;
    }

    .main-nav {
        display: none;
        flex-direction: column;
        background: white;
        position: absolute;
        top: 60px;
        left: 0;
        right: 0;
        padding: 20px;
        gap: 16px;
        border-top: 1px solid #e7e1d9;
        box-shadow: 0 20px 30px rgba(0,0,0,0.04);
    }

    .main-nav.open {
        display: flex;
    }

    .hero-content h1 {
        font-size: 2rem;
    }

    .section-heading h2 {
        font-size: 1.6rem;
    }

    .hero {
        padding: 20px 0 16px;
        margin: 12px 0 16px;
    }
}

@media (max-width: 480px) {
    .episodes-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .season-btn {
        padding: 4px 14px;
        font-size: 0.8rem;
    }

    .hero-content h1 {
        font-size: 1.6rem;
    }

    .logo-text {
        font-size: 1.1rem;
    }
}

/* ===== PRINT ===== */
@media print {
    .site-header {
        position: static;
    }

    .menu-toggle,
    .main-nav {
        display: none !important;
    }
}
</style>

<!-- Favicon -->
<link rel="icon" href="/favicon.ico" type="image/x-icon">

<!-- Open Graph -->
<meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ if .IsHome }}{{ .Site.Params.description }}{{ else if .Description }}{{ .Description }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
<meta name="twitter:card" content="summary_large_image">

<!-- Structured Data - Homepage Only -->
{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebSite",
      "@id": "{{ .Site.BaseURL }}#website",
      "url": "{{ .Site.BaseURL }}",
      "name": "{{ .Site.Title }}",
      "description": "{{ .Site.Data.drama.drama.description }}"
    },
    {
      "@type": "WebPage",
      "@id": "{{ .Site.BaseURL }}#webpage",
      "url": "{{ .Site.BaseURL }}",
      "name": "{{ .Title }}",
      "description": "{{ .Site.Data.drama.drama.description }}",
      "isPartOf": {
        "@id": "{{ .Site.BaseURL }}#website"
      },
      "about": {
        "@id": "{{ .Site.BaseURL }}#tvseries"
      },
      "mainEntity": {
        "@id": "{{ .Site.BaseURL }}#tvseries"
      }
    },
    {
      "@type": "TVSeries",
      "@id": "{{ .Site.BaseURL }}#tvseries",
      "name": "{{ .Site.Data.drama.drama.name }}",
      "description": "{{ .Site.Data.drama.drama.description }}"
    }
  ]
}
</script>
{{ end }}

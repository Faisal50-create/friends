backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  # Blog Collection
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Categories", name: "categories", widget: "list", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Description (short)", name: "description", widget: "text", required: false }
      - { label: "SEO Title", name: "seo_title", widget: "string", required: false }
      - { label: "Meta description", name: "meta_description", widget: "text", required: false }
      - { label: "Canonical URL", name: "canonical", widget: "string", required: false }
      - { label: "SEO Keywords", name: "keywords", widget: "list", field: { label: "Keyword", name: "keyword", widget: "string" }, required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  # Dramas Collection - NEW
  - name: "dramas"
    label: "Dramas"
    label_singular: "Drama"
    folder: "content/dramas"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Title", name: "title", widget: "string", default: "Episode 1" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Drama Name", name: "drama", widget: "string" }
      - { label: "Season", name: "season", widget: "number", valueType: "int" }
      - { label: "Episode", name: "episode", widget: "number", valueType: "int" }
      - { label: "Episode Title", name: "episode_title", widget: "string", required: false }
      - { label: "Duration", name: "duration", widget: "string", required: false }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Keywords", name: "keyword", widget: "string", required: false }
      - { label: "Body Content", name: "body", widget: "markdown", required: false }